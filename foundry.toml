# Same compiler settings as the mainnet deployment (carry contracts/foundry.toml, profile "follower").
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
gas_limit = "18446744073709551615"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solmate/=lib/v4-core/lib/solmate/",
]
